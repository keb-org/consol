name: CI & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun test

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: bun install
      - name: Publish if package.json version bumped
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view @kryat/consol version 2>/dev/null || echo "0.0.0")
          if [ "$PKG_VERSION" != "$NPM_VERSION" ]; then
            echo "Publishing @kryat/consol $PKG_VERSION (npm has $NPM_VERSION)..."
            npm publish --provenance --access public
          else
            echo "Version $PKG_VERSION already on npm. Skipping."
          fi
